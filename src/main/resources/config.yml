  Armor: ['*_HELMET', '*_CHESTPLATE', '*_LEGGINGS', '*_BOOTS', 'ELYTRA', 'SHIELD']
  Tools: ['*_PICKAXE', '*_SHOVEL', '*_HOE', 'SHEARS', 'FISHING_ROD', 'FLINT_AND_STEEL', 'BRUSH']
  Makanan: ['*BEEF*', '*PORKCHOP*', '*CHICKEN*', '*MUTTON*', '*RABBIT*', '*COD*', '*SALMON*', '*APPLE', '*CARROT', '*POTATO', 'BREAD', 'COOKIE', 'CAKE', '*STEW', '*SOUP', 'MELON_SLICE', '*BERRIES']
  Resource: ['*_INGOT', '*_NUGGET', '*_ORE', 'DIAMOND', 'EMERALD', 'COAL', 'CHARCOAL', 'REDSTONE', 'LAPIS_LAZULI', 'QUARTZ', 'AMETHYST_SHARD', 'NETHERITE_SCRAP', 'ANCIENT_DEBRIS']
  Blok: ['*_PLANKS', '*_LOG', '*_WOOD', '*_STONE', '*_BRICKS', '*_CONCRETE', '*_TERRACOTTA', '*_WOOL', '*_SLAB', '*_STAIRS', '*_FENCE', 'STONE', 'COBBLESTONE', 'DIRT', 'GRASS_BLOCK', 'SAND', 'GRAVEL']
